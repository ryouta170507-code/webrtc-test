<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit WebRTC 通話</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #1a202c;
        }

        #connect-btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        #connect-btn:hover {
            background-color: #0052a3;
        }
        #connect-btn:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 参加者のカードが並ぶグリッド構造 */
        #videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* ユーザーごとのカード枠（カメラなしでもこれが表示される） */
        .participant-card {
            background-color: #2d3748;
            border-radius: 12px;
            aspect-ratio: 4 / 3;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* カメラがないときのアバター表示 */
        .avatar-placeholder {
            width: 80px;
            height: 80px;
            background-color: #4a5568;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e0;
            font-size: 2rem;
            font-weight: bold;
        }

        /* ビデオ映像（カードの中にピッタリ収める） */
        .participant-card video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ユーザー名ラベル（左下に重ねる） */
        .name-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h2>LiveKit Room</h2>
    <button id="connect-btn">通話に参加</button>
    <div id="videos"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
