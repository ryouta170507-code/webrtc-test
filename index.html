<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit WebRTC 通話</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>LiveKit Room</h2>
    
    <!-- 入室前の設定エリア -->
    <div class="setup-container" id="setup-area">
        <input type="text" id="username-input" placeholder="名前を入力してください">
        <button id="connect-btn" class="btn">通話に参加</button>
    </div>

    <!-- 通話中の操作ボタンエリア（名前変更欄を削除） -->
    <div id="controls">
        <button id="toggle-mic-btn" class="btn control-btn">マイクをミュート</button>
        <button id="toggle-cam-btn" class="btn control-btn">カメラをオフ</button>
        <button id="leave-btn" class="btn">退室する</button>
    </div>

    <div id="videos"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
